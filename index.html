<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Habibty ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Opening Screen -->
    <div id="opening">
        <div class="opening-box">
            <div class="big-heart">❤️</div>
            <h1>For My Habibty</h1>
            <p>
                Na shirya miki wani ƙaramin surprise
                daga Habibinki, Sas ❤️
            </p>
            <button id="openButton">
                Open My Surprise ❤️
            </button>
        </div>
    </div>

    <!-- Main Love Page -->
    <main id="lovePage">
        <div class="card">
            <h2>
                Good Morning, Habibty ❤️
            </h2>
            <p class="from">
                From your Habibi — Sas 💕
            </p>
            <img
                src="images/habibty.jpg"
                class="habibty-photo"
                alt="My Habibty"
            >
            <div id="message">
                Good morning, my Habibty ❤️
            </div>
            <audio id="music" loop>
                <source
                    src="music/romantic.mp3"
                    type="audio/mpeg"
                >
            </audio>
            <p class="signature">
                Forever your Habibi — Sas ❤️
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
